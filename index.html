<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f1b2d;--soft:#5d6b82;--acc:#2f5bea;--accink:#fff;--ok:#0f9d6e;--bad:#d63c44;--line:#d5dce8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1524;--card:#17223a;--ink:#eaf0fb;--soft:#9fb0cb;--acc:#6e93ff;--accink:#0e1524;--ok:#3ddba5;--bad:#ff7b82;--line:#2a3a5c}}
:root[data-theme="dark"]{--bg:#0e1524;--card:#17223a;--ink:#eaf0fb;--soft:#9fb0cb;--acc:#6e93ff;--accink:#0e1524;--ok:#3ddba5;--bad:#ff7b82;--line:#2a3a5c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 8px;font-weight:800}
.sub{color:var(--soft);margin:4px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.meta{color:var(--soft);font-size:14px}
.bar{height:8px;background:var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:10px;padding:10px 18px;font-weight:800}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.q{font-size:21px;font-weight:600;margin:8px 0 14px}
.gap{border-bottom:3px solid var(--acc);padding:0 18px}
.hint{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-weight:800;margin-left:6px}
input[type=text],textarea{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:220px;resize:vertical;font-size:16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:18px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.fb{margin-top:12px;padding:12px;border-radius:10px;border-left:5px solid var(--ok);background:var(--bg)}
.fb.bad{border-color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-weight:600}
.tab[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.cnt{font-weight:800}.cnt.ok{color:var(--ok)}.cnt.no{color:var(--bad)}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}
ul{margin:6px 0;padding-left:20px}
label{display:block;margin:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
</style>
</head>

function fb(task,text,out){
if(!SM){out.textContent="Claude недоступен в этом окне.";return}
if(!text.trim()){out.textContent="Сначала напиши или произнеси текст.";return}
out.textContent="Claude проверяет…";
SM("You are a strict but kind EGE English examiner. Task: "+task+"\nStudent answer (may come from speech recognition, ignore punctuation and capitalisation):\n"+text+"\nReply in Russian. Give: 1) did the answer cover all points of the task; 2) grammar and vocabulary mistakes with corrections; 3) three concrete tips; 4) a rough mark out of 3 for content, language and organisation. Be concise.",{onText:function(r){out.textContent=r.text},cache:false}).catch(function(e){out.textContent="Не получилось: "+(e&&e.message||"ошибка")})}
function speak(){
app.innerHTML=hdr("Устная часть")+'<div class="card"><h2>Читать вслух</h2><div class="meta">Произнеси фразу, приложение отметит слова, которые не удалось распознать</div><div class="row" style="margin-top:10px"><button class="btn" id="a1">Начать</button></div></div><div class="card"><h2>Монолог и ответы на вопросы</h2><div class="meta">Говори по теме, потом Claude разберёт ответ</div><div class="row" style="margin-top:10px"><button class="btn" id="a2">Начать</button></div></div><div class="meta">Нужен Chrome или Safari и доступ к микрофону. Проверка сравнивает слова, а не звуки, поэтому это ориентир, а не оценка эксперта.</div>';

function score(t){var bag=words(t),ok=0,tk=s.split(" "),h="";
tk.forEach(function(w){var p=bag.indexOf(words(w)[0]),g=p>-1;if(g){bag.splice(p,1);ok++}h+='<span class="cnt '+(g?"ok":"no")+'">'+esc(w)+'</span> '});
var pc=Math.round(ok/tk.length*100);
rs.innerHTML=h+'<p><b>'+pc+'%</b> слов распознано. Услышано: <i>'+esc(t)+'</i></p><p class="meta">'+(pc>=85?"Очень чётко!":"Красные слова не распознаны: послушай образец и повтори их медленнее.")+'</p>'}
mk.onclick=function(){
if(on){rc&&rc.stop();return}
rs.textContent="Слушаю… говори, в конце сделай паузу";mk.textContent="⏹ Стоп";on=true;
rc=mic(false,score,function(m){rs.textContent=m});
if(rc)rc.onend=function(){on=false;mk.textContent="🎤 Говорить"};else{on=false;mk.textContent="🎤 Говорить"}}}

document.getElementById("nt").onclick=function(){try{rc&&rc.abort()}catch(x){}mono(i+1)};
document.getElementById("ck").onclick=function(){fb(tk,tx.value,co)};

var base=tx.value?tx.value+" ":"";on=true;mk.textContent="⏹ Стоп";

function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim()}
function home(){
R=null;var h='<h1>English: от нуля до ЕГЭ</h1><p class="sub">Это обучалка: в каждом уроке сначала объяснение с примерами, потом упражнения. Ошибки повторяются в конце урока. Финальный уровень — подготовка к ЕГЭ.</p>';
LV.forEach(function(L,i){var o=lvOpen(i);h+='<div class="card"><h2>'+L.n+'</h2><div class="meta">'+L.t+'</div><div class="row" style="margin-top:10px"><button class="btn" data-l="'+i+'"'+(o?'':' disabled')+'>'+(o?'Открыть':'Сначала пройди предыдущий уровень')+'</button></div></div>'});

h+='<div class="card"><h2>'+s.name+'</h2><div class="meta">'+s.task+' · '+s.items.length+' заданий в банке</div><div class="bar"><i style="width:'+p+'%"></i></div><div class="row"><span class="meta">'+(d.n?'Верно '+d.r+' из '+d.n+' ('+p+'%)':'Ещё не начато')+'</span><span style="flex:1"></span><button class="btn" data-s="'+k+'">Тренировать 10</button></div></div>'});
h+='<div class="card"><h2>Чтение</h2><div class="meta">Задания 10–18: тексты, True/False/Not stated, тесты</div><div class="row" style="margin-top:10px"><button class="btn" id="rd">Читать</button></div></div><div class="card"><h2>Устная часть</h2><div class="meta">Чтение вслух с проверкой произношения и монолог с разбором от Claude</div><div class="row" style="margin-top:10px"><button class="btn" id="sp">Говорить</button></div></div>';
h+='<div class="card"><h2>Работа над ошибками</h2><div class="meta">В списке: '+st.m.length+'</div><div class="row" style="margin-top:10px"><button class="btn" id="mis"'+(st.m.length?'':' disabled')+'>Повторить ошибки</button></div></div>';
h+='<div class="card"><h2>Письменная часть</h2><div class="meta">Задания 39 и 40: счётчик слов, чек-лист, фразы</div><div class="row" style="margin-top:10px"><button class="btn" id="wr">Писать</button></div></div>';
app.innerHTML=h;
Array.prototype.forEach.call(app.querySelectorAll("[data-s]"),function(b){b.onclick=function(){begin(b.dataset.s)}});
document.getElementById("mis").onclick=function(){R={q:sh(st.m.map(function(x){return x.slice()})).slice(0,10),i:0,r:0,mode:"m"};show()};
document.getElementById("wr").onclick=function(){writing(0)};
document.getElementById("rd").onclick=readList;document.getElementById("sp").onclick=speak;
Array.prototype.forEach.call(app.querySelectorAll("[data-l]"),function(b){b.onclick=function(){level(+b.dataset.l)}});
}
function begin(k){var idx=sh(S[k].items.map(function(_,i){return i})).slice(0,10);R={q:idx.map(function(i){return[k,i]}),i:0,r:0,mode:k};show()}

if(R.i>=R.q.length)return done();
var k=R.q[R.i][0],ix=R.q[R.i][1],s=S[k],it=s.items[ix],h=hdr(s.name+' · '+(R.i+1)+' из '+R.q.length);
h+='<div class="card"><div class="q">';
if(s.kind==="t"){h+=esc(it[0]).replace("___",'<span class="gap"></span>')+'<span class="hint">'+it[1]+'</span></div><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ"><div class="row" style="margin-top:10px"><button class="btn" id="ck">Проверить</button></div>'}
else{h+=esc(it[0]).replace("___",'<span class="gap"></span>')+'</div>'+it[1].map(function(o,j){return '<button class="opt" data-j="'+j+'">'+esc(o)+'</button>'}).join("")}

if(s.kind==="t"){var inp=document.getElementById("in");inp.focus();
var go=function(){var v=norm(inp.value);if(!v)return;var ok=it[2].some(function(a){return norm(a)===v});finish(k,ix,ok,"Правильно: <b>"+esc(it[2].join(" / "))+"</b>. "+esc(it[3]));inp.disabled=true;document.getElementById("ck").disabled=true};
document.getElementById("ck").onclick=go;inp.onkeydown=function(e){if(e.key==="Enter")go()}}
else{Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){var j=+b.dataset.j,ok=j===it[2];
Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(x){x.disabled=true;if(+x.dataset.j===it[2])x.classList.add("ok")});
if(!ok)b.classList.add("no");finish(k,ix,ok,esc(it[3]))}})}
}
function finish(k,ix,ok,msg){
var d=st.d[k]||(st.d[k]={n:0,r:0});d.n++;if(ok){d.r++;R.r++}
var key=k+":"+ix,pos=-1;st.m.forEach(function(x,i){if(x[0]===k&&x[1]===ix)pos=i});
if(ok&&pos>-1)st.m.splice(pos,1);if(!ok&&pos<0)st.m.push([k,ix]);save();
var f=document.getElementById("fb");f.innerHTML='<div class="fb'+(ok?'':' bad')+'"><b>'+(ok?'Верно!':'Пока неверно.')+'</b> '+msg+'</div><div class="row" style="margin-top:10px"><button class="btn" id="nx" autofocus>Дальше</button></div>';
var nx=document.getElementById("nx");nx.focus();nx.onclick=function(){R.i++;show()}}
function done(){
var p=Math.round(R.r/R.q.length*100);st.b=st.b||{};if((st.b[R.mode]||0)<p){st.b[R.mode]=p;save()}
